# Add inside the server block of the shared projects.lucina.dev nginx site
# (projects/viapeople-archive-vm/deploy/projects.lucina.dev.nginx, installed to /etc/nginx/sites-available/).
# The API is built with BASE_PATH=/pokemon-tcg-deck-builder, so the path is passed through as is.
location /pokemon-tcg-deck-builder {
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s; # pokemontcg.io can be slow, and failed upstream calls are retried
}
